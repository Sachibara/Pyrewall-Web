<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#1e60b0">
  <title>Admin Login Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-window">
    <section class="login-logo-panel">
      <img src="https://raw.githubusercontent.com/Sachibara/Pyrewall/main/ui/FFLogo.png" alt="PyreWall logo">
    </section>
    <section class="login-form-panel">
      {% if error %}
      <div class="first-run-banner login-error">{{ error }}</div>
      {% endif %}
      <form method="post" class="desktop-login-form">
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <input type="text" name="username" autocomplete="username" required autofocus placeholder="Username">
        <input type="password" name="password" autocomplete="current-password" required placeholder="Password">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <span class="forgot-details">forgot details?</span>
        <button class="signin-btn" type="submit">Sign in</button>
      </form>
      <small class="local-login-note">Uses the original PyreWall users database and hashed authentication.</small>
    </section>
  </main>
</body>
</html>
